<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能短腳本產生器 | 命理咖啡工作室</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 min-h-screen py-8 px-4 text-stone-800">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-amber-100">
        <!-- 頂部標題區 -->
        <div class="bg-gradient-to-r from-amber-700 to-stone-700 text-white p-6 text-center">
            <h1 class="text-2xl font-bold tracking-wide">☕ 命理咖啡：AI 智能短腳本產生器</h1>
            <p class="text-amber-200 text-sm mt-1">結合 Gemini AI，為你量身打造 IG Reels / Threads 獨家腳本</p>
        </div>

        <!-- 內容操作區 -->
        <div class="p-6 md:p-8 space-y-6">
            
            <!-- API Key 設定區 -->
            <div class="bg-amber-50/80 p-4 rounded-xl border border-amber-200/60">
                <label class="block text-xs font-semibold text-amber-900 mb-1">🔑 Gemini API Key設定（支援 AQ. 開頭新版金鑰）</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="貼上您的 Gemini API Key (AQ.開頭)..." class="w-full p-2 text-sm border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <button onclick="saveApiKey()" class="bg-stone-700 hover:bg-stone-800 text-white text-xs px-4 py-2 rounded-lg font-medium transition whitespace-nowrap">儲存金鑰</button>
                </div>
                <p class="text-[11px] text-stone-500 mt-1">金鑰僅會保存在你自己的瀏覽器本機端（LocalStorage），不會外泄。</p>
            </div>

            <!-- 選擇主題類型 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">1. 選擇腳本風格 / 主題</label>
                <select id="contentType" class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
                    <option value="pov">🎬 POV 沉浸式情境短片（引發共鳴、帶入咖啡與命理氛圍）</option>
                    <option value="tarot">🔮 塔羅 / 卡牌指引與心理測驗引言</option>
                    <option value="stems">🌟 十天干運勢與日常心靈提醒</option>
                    <option value="coffee">☕ 咖啡店日常與命理師的溫暖碎碎念</option>
                </select>
            </div>

            <!-- 選擇說話語調 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">2. 選擇文案語調</label>
                <select id="toneType" class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
                    <option value="warm">溫暖療癒風（像一杯熱拿鐵，給予陪伴與安慰）</option>
                    <option value="spicy">犀利直白風（一針見血戳中盲點，引發熱烈留言討論）</option>
                    <option value="calm">沉穩內斂風（帶有哲理與思考空間，適合深度共鳴）</option>
                </select>
            </div>

            <!-- 輸入核心關鍵字 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">3. 輸入核心關鍵字或當下靈感</label>
                <input type="text" id="keywordInput" placeholder="例如：覺得內耗、想離職又不敢、水逆期間的心態調整..." class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
            </div>

            <!-- 按鈕 -->
            <button onclick="generateAIScript()" id="generateBtn" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition duration-200 flex items-center justify-center space-x-2">
                <span>✨ 呼叫 AI 靈感大腦，開始生成！</span>
            </button>

            <!-- 結果顯示區 -->
            <div class="mt-8 border-t border-stone-200 pt-6">
                <div class="flex justify-between items-center mb-3">
                    <label class="block text-sm font-semibold text-stone-700">4. AI 生成結果（可直接複製）</label>
                    <button onclick="copyResult()" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-700 px-3 py-1.5 rounded-lg font-medium transition">
                        📋 複製全文
                    </button>
                </div>
                <div id="outputArea" class="w-full h-80 p-4 border border-stone-300 rounded-xl bg-stone-50 text-stone-700 whitespace-pre-wrap overflow-y-auto text-sm leading-relaxed">
請先在上方填入您的 Gemini API Key (AQ.開頭)，選擇風格與關鍵字，點擊按鈕後 AI 就會開始為您創作獨一無二的腳本！
                </div>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key 已成功儲存於瀏覽器！');
            } else {
                alert('請輸入有效的 API Key');
            }
        }

        async function generateAIScript() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('請先設定您的 Gemini API Key 才能使用 AI 生成功能喔！');
                return;
            }

            const contentType = document.getElementById('contentType').value;
            const toneType = document.getElementById('toneType').value;
            const keyword = document.getElementById('keywordInput').value.trim();

            if (!keyword) {
                alert('請輸入核心關鍵字或靈感主題！');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const outputArea = document.getElementById('outputArea');
            
            btn.disabled = true;
            btn.innerText = '☕ AI 正在細細烘焙靈感中，請稍候...';
            outputArea.innerText = '✨ 靈感正在生成中，請稍候...';

            const prompt = `
你是一位經營「命理咖啡工作室」的專業命理師兼內容創作者（多多老師），擅長結合咖啡店的溫暖氛圍、貓咪的陪伴，以及專業的命理觀點（如塔羅、十天干等）來撰寫社群短影片（IG Reels / Threads）腳本與文案。

請根據以下「嚴格條件」為我創作：
- 目標腳本類型：${contentType} （請務必完全對應這個類型的結構來寫，如果是塔羅就專注塔羅指引、如果是十天干就專注天干運勢、如果是咖啡日常就寫店內碎碎念，不要全部都寫成 Reels 運鏡！）
- 指定語調：${toneType}
- 核心主題/關鍵字：${keyword}

【絕對遵守規則】
1. 請直接輸出最終的社群文案與腳本內容，**絕對不要**加上任何像「這是一份為你量身打造的...」或「好的，以下是...」的對話開場白或結語。
2. 語氣要自然、流暢、符合命理咖啡工作室的專業又療癒人心的風格。
            `;

            try {
                // 已更新為最新推薦的 gemini-3.6-flash 模型
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    outputArea.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    console.error('API 回傳詳細錯誤：', data);
                    throw new Error(data.error?.message || 'API 回傳格式有誤或金鑰失效');
                }

            } catch (error) {
                console.error(error);
                outputArea.innerText = `❌ 生成失敗：${error.message}\n請確認您的 AQ. 金鑰是否正確。`;
            } finally {
                btn.disabled = false;
                btn.innerText = '✨ 呼叫 AI 靈感大腦，開始生成！';
            }
        }

        function copyResult() {
            const outputText = document.getElementById('outputArea').innerText;
            navigator.clipboard.writeText(outputText).then(() => {
                alert('已成功複製腳本內容！');
            }).catch(err => {
                console.error('複製失敗', err);
            });
        }
    </script>
</body>
</html>
