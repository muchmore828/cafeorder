<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作室專屬 AI 內容長 | 命理咖啡工作室</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 min-h-screen py-8 px-4 text-stone-800">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-amber-100">
        <!-- 頂部標題區 -->
        <div class="bg-gradient-to-r from-amber-800 to-stone-700 text-white p-6 text-center">
            <h1 class="text-2xl font-bold tracking-wide">☕ 命理咖啡工作室：AI 內容長</h1>
            <p class="text-amber-200 text-sm mt-1">內建學習記憶庫 ＋ 嚴格字數控管 ＋ 專業生圖提示詞生成</p>
        </div>

        <!-- 內容操作區 -->
        <div class="p-6 md:p-8 space-y-6">
            
            <!-- API Key 設定區 -->
            <div class="bg-amber-50/80 p-4 rounded-xl border border-amber-200/60">
                <label class="block text-xs font-semibold text-amber-900 mb-1">🔑 Gemini API Key設定（支援 AQ. 開頭新版金鑰）</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="貼上您的 Gemini API Key (AQ.開頭)..." class="w-full p-2 text-sm border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <button onclick="saveApiKey()" class="bg-stone-700 hover:bg-stone-800 text-white text-xs px-4 py-2 rounded-lg font-medium transition whitespace-nowrap">儲存金鑰</button>
                </div>
                <p class="text-[11px] text-stone-500 mt-1">金鑰僅會保存在你自己的瀏覽器本機端（LocalStorage），不會外泄。</p>
            </div>

            <!-- 學習記憶庫：工作室偏好設定 -->
            <div class="bg-stone-50 p-4 rounded-xl border border-stone-200">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-stone-700">🧠 工作室專屬學習記憶庫（AI 內容長的長期偏好）</label>
                    <button onclick="clearMemory()" class="text-[10px] text-red-600 hover:underline">清除記憶重置</button>
                </div>
                <textarea id="memoryBox" placeholder="例如：多多老師喜歡溫柔帶點日常陪伴感的語氣，常提到橘貓Kento..." class="w-full p-2.5 text-xs border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none h-20"></textarea>
                <button onclick="saveMemory()" class="mt-2 bg-amber-700 hover:bg-amber-800 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">💾 儲存並更新 AI 長期記憶</button>
            </div>

            <!-- 選擇主題類型 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">1. 選擇發文 / 小卡類型</label>
                <select id="contentType" class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
                    <option value="coffee">☕ 咖啡店日常與命理師的溫暖碎碎念（Threads/IG 純文字散文）</option>
                    <option value="pov">🎬 POV 沉浸式情境短片（帶畫面運鏡與療癒口白）</option>
                    <option value="tarot">🔮 塔羅 / 卡牌指引與心理測驗引言（互動式小卡）</option>
                    <option value="stems">🌟 十天干運勢與日常心靈提醒（心靈小卡）</option>
                </select>
            </div>

            <!-- 選擇說話語調 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">2. 選擇文案語調</label>
                <select id="toneType" class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
                    <option value="warm">溫暖療癒風（像一杯熱拿鐵，給予陪伴與安慰）</option>
                    <option value="spicy">犀利直白風（一針見血戳中盲點，引發熱烈留言討論）</option>
                    <option value="calm">沉穩內斂風（帶有哲理與思考空間，適合深度共鳴）</option>
                </select>
            </div>

            <!-- 選擇目標圖片視覺風格 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">3. 選擇圖片視覺風格（產出對應提示詞）</label>
                <select id="imageStyle" class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
                    <option value="pastel">🖍️ 粉彩蠟筆風（溫暖、柔和、療癒手繪感）</option>
                    <option value="anime">🌸 日系溫馨動畫風（吉卜力感、精緻光影、細膩日常）</option>
                    <option value="watercolor">🎨 水彩手繪風（暈染美感、文青質感、浪漫氛圍）</option>
                    <option value="pixel">👾 復古像素風（可愛像素藝術、趣味電玩感）</option>
                    <option value="photo">📸 質感寫實攝影風（溫暖咖啡館實景、柔焦、高質感）</option>
                </select>
            </div>

            <!-- 輸入核心關鍵字 -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">4. 輸入核心關鍵字或當下靈感</label>
                <input type="text" id="keywordInput" placeholder="例如：覺得內耗、想離職又不敢、雨天店裡的慵懶心情..." class="w-full p-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-stone-50">
            </div>

            <!-- 按鈕 -->
            <button onclick="generateAll()" id="generateBtn" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition duration-200 flex items-center justify-center space-x-2">
                <span>✨ 呼叫 AI 內容長，一鍵產出黃金文案與專業生圖提示詞！</span>
            </button>

            <!-- 結果顯示區：文案 -->
            <div class="mt-8 border-t border-stone-200 pt-6">
                <div class="flex justify-between items-center mb-3">
                    <label class="block text-sm font-semibold text-stone-700">5. AI 產出文案（嚴格 250-400 字黃金長度）</label>
                    <button onclick="copyResult()" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-700 px-3 py-1.5 rounded-lg font-medium transition">
                        📋 複製文案
                    </button>
                </div>
                <div id="outputArea" class="w-full h-64 p-4 border border-stone-300 rounded-xl bg-stone-50 text-stone-700 whitespace-pre-wrap overflow-y-auto text-sm leading-relaxed">
請先在上方填入您的 Gemini API Key，隨後點擊按鈕開始創作！
                </div>
            </div>

            <!-- 結果顯示區：專屬生圖提示詞 -->
            <div class="mt-6 border-t border-stone-200 pt-6">
                <div class="flex justify-between items-center mb-3">
                    <label class="block text-sm font-semibold text-stone-700">6. 專屬生圖提示詞（Prompt 產生器）</label>
                    <button onclick="copyPromptResult()" class="text-xs bg-amber-800 hover:bg-amber-900 text-white px-3 py-1.5 rounded-lg font-medium transition">
                        📋 複製提示詞
                    </button>
                </div>
                <div id="promptArea" class="w-full p-4 border border-stone-300 rounded-xl bg-amber-50/50 text-stone-700 whitespace-pre-wrap text-sm leading-relaxed min-h-[120px]">
點擊上方按鈕後，這裡會為你量身打造高品質的生圖提示詞（可直接貼入你的生圖工具）...
                </div>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

            const savedMemory = localStorage.getItem('studio_memory');
            if (savedMemory) {
                document.getElementById('memoryBox').value = savedMemory;
            } else {
                const defaultMemory = "工作室核心：命理咖啡工作室，多多老師經營，有可愛橘貓Kento。溫暖療癒、拒絕說教。";
                document.getElementById('memoryBox').value = defaultMemory;
                localStorage.setItem('studio_memory', defaultMemory);
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key 已成功儲存！');
            } else {
                alert('請輸入有效的 API Key');
            }
        }

        function saveMemory() {
            const memory = document.getElementById('memoryBox').value.trim();
            localStorage.setItem('studio_memory', memory);
            alert('🧠 AI 內容長的長期記憶已成功更新！');
        }

        function clearMemory() {
            localStorage.removeItem('studio_memory');
            document.getElementById('memoryBox').value = '';
            alert('記憶已重置！');
        }

        async function generateAll() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('請先設定您的 Gemini API Key 喔！');
                return;
            }

            const contentType = document.getElementById('contentType').value;
            const toneType = document.getElementById('toneType').value;
            const styleChoice = document.getElementById('imageStyle').value;
            const keyword = document.getElementById('keywordInput').value.trim();
            const userMemory = document.getElementById('memoryBox').value.trim();

            if (!keyword) {
                alert('請輸入核心關鍵字或靈感主題！');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const outputArea = document.getElementById('outputArea');
            const promptArea = document.getElementById('promptArea');
            
            btn.disabled = true;
            btn.innerText = '☕ AI 內容長正在調閱記憶並產出文案與專屬提示詞中...';
            outputArea.innerText = '✨ 靈感生成中，請稍候...';
            promptArea.innerText = '✨ 提示詞建構中...';

            // 讓 Gemini 同時幫忙產出文案，並根據風格寫出完美的英文生圖 Prompt
            const prompt = `
你是「命理咖啡工作室」的專屬 AI 內容長。
【工作室記憶與偏好】：${userMemory}
【本次條件】：類型: ${contentType}，語調: ${toneType}，風格選項: ${styleChoice}，主題核心: ${keyword}

請嚴格按照以下兩部分回傳內容：
【PART 1：社群正文】
長度必須嚴格控制在 250 到 400 個中文字之間，直擊人心，帶有 3-5 個 Hashtag。絕對不要加上任何對話開場白。

【PART 2：專業生圖提示詞】
請根據上述「風格選項」與「主題核心」，為我寫出一組精緻、高品質的英文生圖 Prompt（包含：氛圍描述、可愛橘貓Kento元素、光影與材質細節）。請直接提供乾淨的英文 Prompt 文字以便複製。
            `;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const fullText = data.candidates[0].content.parts[0].text;
                    
                    // 智慧切分文案與生圖提示詞
                    let parts = fullText.split('【PART 2');
                    let scriptPart = parts[0].replace('【PART 1：社群正文】', '').trim();
                    let promptPart = parts[1] ? '【PART 2' + parts[1].trim() : '提示詞產生中發生小落差，請重新整理';

                    outputArea.innerText = scriptPart;
                    promptArea.innerText = promptPart.replace('【專業生圖提示詞】', '').trim();
                } else {
                    throw new Error(data.error?.message || 'API 回傳格式有誤');
                }
            } catch (error) {
                console.error(error);
                outputArea.innerText = `❌ 生成失敗：${error.message}`;
                promptArea.innerText = `❌ 提示詞生成失敗`;
            } finally {
                btn.disabled = false;
                btn.innerText = '✨ 呼叫 AI 內容長，一鍵產出黃金文案與專業生圖提示詞！';
            }
        }

        function copyResult() {
            const outputText = document.getElementById('outputArea').innerText;
            navigator.clipboard.writeText(outputText).then(() => {
                alert('已成功複製文案！');
            });
        }

        function copyPromptResult() {
            const promptText = document.getElementById('promptArea').innerText;
            navigator.clipboard.writeText(promptText).then(() => {
                alert('已成功複製生圖提示詞！');
            });
        }
    </script>
</body>
</html>
